# HackPilot YAML configuration
# HackPilot Prometheus scrape configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scraping itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # HackPilot application metrics
  - job_name: 'hackpilot-app'
    static_configs:
      - targets: ['hackpilot-app:8000']
